app.base-url=https://multi-amigos.onrender.com
app.frontend.base-url=https://multi-amigos.onrender.com

# Banco - usa URL do Neon.tech (fixa ou variável)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-rapid-bird-acxuz98r-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configurações de Email (usando as variáveis que você já tem no Render)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Em produção, não mostre SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

# Importante: Não tenta alterar o schema automaticamente
spring.jpa.hibernate.ddl-auto=validate