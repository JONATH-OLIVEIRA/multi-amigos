spring.application.name=multi-amigos

# Profile - padrão dev, Render muda para prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Banco - lê de variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amigos}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# JWT
jwt.secret=${JWT_SECRET}

# URLs
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend.base-url=${FRONTEND_URL:http://localhost:8080}

# Jackson
spring.jackson.generator.stream-write-constraints.max-nesting-depth=1000
spring.jackson.generator.stream-write-constraints.max-document-length=10000000
spring.jackson.parser.max-nesting-depth=1000

# Proxy (Render)
server.forward-headers-strategy=framework