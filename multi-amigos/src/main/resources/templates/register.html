<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - MultiAmigos</title>
<link rel="stylesheet" href="/css/login.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<!-- jQuery Mask Plugin -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

</head>
<body>

	<div class="container">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="register-card">
					<div class="text-center mb-4">
						<h2 class="fw-bold">Criar Nova Conta</h2>
						<p class="text-muted">Preencha os dados para se cadastrar</p>
					</div>

					<form id="registerForm">
						<div id="formErrors" class="alert alert-danger d-none">
							<i class="bi bi-exclamation-triangle"></i> <span
								id="errorMessage"></span>
						</div>

						<div class="mb-3">
							<label for="nome" class="form-label"> <i
								class="bi bi-person"></i> Nome Completo
							</label> <input type="text" class="form-control" id="nome"
								placeholder="Digite seu nome completo" required>
							<div class="form-text">Seu nome como aparecerá no sistema</div>
						</div>

						<div class="mb-3">
							<label for="email" class="form-label"> <i
								class="bi bi-envelope"></i> Email
							</label> <input type="email" class="form-control" id="email"
								placeholder="seu@email.com" required>
							<div class="form-text">Utilize um email válido</div>
						</div>

						<!-- CAMPO TELEFONE COM MÁSCARA MELHORADA -->
						<div class="mb-3">
							<label for="telefone" class="form-label"> <i
								class="bi bi-telephone"></i> Telefone
							</label> <input type="tel" class="form-control" id="telefone"
								placeholder="(11) 99999-9999">
							<div class="form-text">Formato: (DD) 99999-9999 (obrigatório para recuperação de conta)</div>
						</div>

						<div class="mb-4">
							<label for="senha" class="form-label"> <i
								class="bi bi-lock"></i> Senha
							</label> <input type="password" class="form-control" id="senha"
								placeholder="Mínimo 6 caracteres" required minlength="6">
							<div class="form-text">A senha deve ter pelo menos 6
								caracteres</div>
						</div>

						<div class="mb-4">
							<label for="confirmarSenha" class="form-label"> <i
								class="bi bi-lock-fill"></i> Confirmar Senha
							</label> <input type="password" class="form-control" id="confirmarSenha"
								placeholder="Digite a senha novamente" required>
						</div>

						<button type="submit" class="btn btn-register w-100 mb-3">
							<i class="bi bi-person-plus"></i> Criar Conta
						</button>

						<div class="text-center">
							<p class="mb-0">
								Já tem uma conta? <a href="/auth/login" class="login-link">Faça
									login aqui</a>
							</p>
						</div>
					</form>
				</div>

				<div class="text-center mt-3">
					<a href="/" class="text-white"> <i class="bi bi-arrow-left"></i>
						Voltar para página inicial
					</a>
				</div>
			</div>
		</div>
	</div>

	<!-- Inclua o register.js -->
	<script src="/js/register.js"></script>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

	<script>
		// Máscara de telefone usando jQuery Mask Plugin (padrão consistente)
		document.addEventListener('DOMContentLoaded', function() {
			const telefoneInput = document.getElementById('telefone');
			
			if (telefoneInput) {
				// Aplica máscara de telefone no padrão brasileiro
				$(telefoneInput).mask('(00) 00000-0000', {
					placeholder: '(00) 00000-0000',
					onKeyPress: function(telefone, event, currentField, options) {
						// Remove a formatação atual para contar os dígitos
						const digits = telefone.replace(/\D/g, '').length;
						
						if (digits <= 10) {
							// Telefone fixo: (11) 9999-9999
							$(this).mask('(00) 0000-00009', options);
						} else {
							// Celular: (11) 99999-9999
							$(this).mask('(00) 00000-0000', options);
						}
					}
				});
			}
			
			// Validação do formulário antes de enviar
			const form = document.getElementById('registerForm');
			if (form) {
				form.addEventListener('submit', function(event) {
					const telefone = telefoneInput.value;
					const apenasNumeros = telefone.replace(/\D/g, '');
					
					// Verifica se o telefone tem pelo menos 10 dígitos (com DDD)
					if (apenasNumeros.length > 0 && apenasNumeros.length < 10) {
						event.preventDefault();
						const errorDiv = document.getElementById('formErrors');
						const errorMsg = document.getElementById('errorMessage');
						errorMsg.textContent = 'Por favor, digite um telefone válido com DDD (mínimo 10 dígitos)';
						errorDiv.classList.remove('d-none');
						
						// Remove a mensagem após 5 segundos
						setTimeout(() => {
							errorDiv.classList.add('d-none');
						}, 5000);
						
						return false;
					}
					
					// Se o telefone for válido, normaliza antes de enviar
					if (telefone && apenasNumeros.length >= 10) {
						// Atualiza o campo com o telefone normalizado (apenas números)
						// O register.js vai enviar o valor normalizado
						telefoneInput.value = apenasNumeros;
					}
				});
			}
		});
	</script>
</body>
</html>
