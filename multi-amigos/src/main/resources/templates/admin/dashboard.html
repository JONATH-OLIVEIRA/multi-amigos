<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - MultiAmigos</title>

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/admin-dashboard.css">
  <link rel="stylesheet" href="/css/admin-hierarquia.css">
</head>

<body class="d-flex">
  <!-- Sidebar Menu -->
  <nav class="sidebar">
    <div class="sidebar-header p-3">
      <h5 class="text-white mb-0">
        <i class="bi bi-menu-button-wide"></i> Menu Admin
      </h5>
    </div>

    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" href="#" id="menuUsuarios">
          <i class="bi bi-people"></i> Usuários
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" id="menuHierarquia">
          <i class="bi bi-diagram-3"></i> Hierarquia
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" id="menuMensagens">
          <i class="bi bi-megaphone"></i> Mensagens
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" id="menuDashboard">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" id="menuBusca">
          <i class="bi bi-search"></i> Busca Avançada
        </a>
      </li>

      <li class="nav-item mt-4">
        <hr class="border-light">
      </li>

      <li class="nav-item">
        <a class="nav-link" href="/" id="menuHome">
          <i class="bi bi-house"></i> Home
        </a>
      </li>
    </ul>

    <div class="sidebar-footer p-3 mt-auto">
      <small class="text-muted">
        <i class="bi bi-shield-check"></i> Admin Logado
      </small>
    </div>
  </nav>

  <!-- Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main Content -->
  <div class="main-content flex-grow-1">
    <header class="bg-dark text-white p-3">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <!-- Botão menu (mobile) -->
          <button class="btn btn-outline-dark d-lg-none" id="toggleSidebarBtn" type="button" aria-label="Abrir menu">
            <i class="bi bi-list"></i>
          </button>

          <div>
            <h1 class="h4 mb-0" id="pageTitle">
              <i class="bi bi-speedometer2"></i> Dashboard Admin
            </h1>
            <small class="text-muted" sec:authorize="isAuthenticated()">
              Usuário: <span sec:authentication="name"></span>
              <span sec:authentication="principal.authorities" class="badge bg-success ms-2"></span>
            </small>
          </div>
        </div>

        <button id="logoutBtn" class="btn btn-outline-light">
          <i class="bi bi-box-arrow-right"></i> Sair
        </button>
      </div>
    </header>

    <main class="container-fluid my-4" id="contentArea">
      <!-- Conteúdo será carregado dinamicamente aqui -->
      <div id="loadingArea" class="text-center my-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Selecione uma opção no menu para começar</p>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Seus scripts JavaScript -->
  <script src="/js/admin-dashboard-apoio.js"></script>
  <script src="/js/admin-dashboard.js"></script>
  <script src="/js/admin-mensagens.js"></script>
  <script src="/js/admin-usuarios.js"></script>
  <script src="/js/admin-hierarquia.js"></script>
</body>
</html>
