<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin - MultiAmigos</title>

<!-- CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/admin-dashboard.css">
</head>

<body class="d-flex">
	<!-- Sidebar Menu -->
	<nav class="sidebar">
		<div class="sidebar-header p-3">
			<h5 class="text-white mb-0">
				<i class="bi bi-menu-button-wide"></i> Menu Admin
			</h5>
		</div>

		<ul class="nav flex-column">
			<li class="nav-item"><a class="nav-link active" href="#"
				id="menuUsuarios"> <i class="bi bi-people"></i> Usuários
			</a></li>
			<li class="nav-item"><a class="nav-link" href="#"
				id="menuMensagens"> <i class="bi bi-megaphone"></i> Mensagens
			</a></li>
			<li class="nav-item"><a class="nav-link" href="#"
				id="menuDashboard"> <i class="bi bi-speedometer2"></i> Dashboard
			</a></li>

			<!-- ITEM MODIFICADO - SEM onclick -->
			<li class="nav-item"><a class="nav-link" href="#" id="menuBusca">
					<i class="bi bi-search"></i> Busca Avançada
			</a></li>

			<li class="nav-item mt-4">
				<hr class="border-light">
			</li>

			<li class="nav-item"><a class="nav-link" href="/" id="menuHome">
					<i class="bi bi-house"></i> Home
			</a></li>
		</ul>

		<div class="sidebar-footer p-3 mt-auto">
			<small class="text-muted"> <i class="bi bi-shield-check"></i>
				Admin Logado
			</small>
		</div>
	</nav>

	<!-- Main Content -->
	<div class="main-content flex-grow-1">
		<header class="bg-dark text-white p-3">
			<div
				class="container-fluid d-flex justify-content-between align-items-center">
				<div>
					<h1 class="h4 mb-0" id="pageTitle">
						<i class="bi bi-speedometer2"></i> Dashboard Admin
					</h1>
					<small class="text-muted" sec:authorize="isAuthenticated()">
						Usuário: <span sec:authentication="name"></span> <span
						sec:authentication="principal.authorities"
						class="badge bg-success ms-2"></span>
					</small>
				</div>

				<button id="logoutBtn" class="btn btn-outline-light">
					<i class="bi bi-box-arrow-right"></i> Sair
				</button>
			</div>
		</header>

		<main class="container-fluid my-4" id="contentArea">
			<!-- ADICIONE ESTE BOTÃO DE TESTE TEMPORÁRIO -->
			<div class="alert alert-warning m-3">
				<h5>🛠️ Teste de Acesso à Busca</h5>
				<button id="testeBuscaDireto" class="btn btn-danger">
					<i class="bi bi-search"></i> TESTE: Acessar Busca Avançada
				</button>
				<small class="text-muted d-block mt-2">Use este botão para
					testes</small>
			</div>

			<div id="loadingArea" class="text-center my-5">
				<div class="spinner-border text-primary"></div>
				<p class="mt-2">Carregando conteúdo...</p>
			</div>
		</main>
	</div>

	<!-- ===================================================== -->
	<!-- TODOS OS MODAIS (mantenha todos) -->
	<!-- ===================================================== -->

	<!-- Scripts -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

	<!-- SCRIPT PRINCIPAL DO DASHBOARD - UNIFICADO -->
	<script>
	document.addEventListener('DOMContentLoaded', function() {
	    console.log('=== DASHBOARD INICIALIZADO ===');
	    
	    // ====================================================
	    // 1. VERIFICAÇÃO SEGURA DE TOKEN (MÚLTIPLAS FONTES)
	    // ====================================================
	    
	    let jwtToken = null;
	    
	    // A. Tenta da URL (se veio da busca com token na URL)
	    const urlParams = new URLSearchParams(window.location.search);
	    const tokenFromUrl = urlParams.get('token');
	    
	    if (tokenFromUrl) {
	        console.log('⚠️ Token encontrado na URL (não recomendado)');
	        jwtToken = tokenFromUrl;
	        localStorage.setItem('token', jwtToken);
	        
	        // LIMPA IMEDIATAMENTE a URL por segurança
	        window.history.replaceState({}, document.title, window.location.pathname);
	        console.log('✅ URL limpa (token removido do histórico)');
	    }
	    
	    // B. Tenta do sessionStorage (método mais seguro - vindo da busca)
	    if (!jwtToken) {
	        const tokenFromSession = sessionStorage.getItem('dashboard_token') || 
	                                 sessionStorage.getItem('jwt_token');
	        
	        if (tokenFromSession) {
	            console.log('✅ Token recebido via sessionStorage (método seguro)');
	            jwtToken = tokenFromSession;
	            localStorage.setItem('token', jwtToken);
	            
	            // Limpa sessionStorage (uso único)
	            sessionStorage.removeItem('dashboard_token');
	            sessionStorage.removeItem('jwt_token');
	        }
	    }
	    
	    // C. Tenta do localStorage (persistente)
	    if (!jwtToken) {
	        jwtToken = localStorage.getItem('token');
	        if (jwtToken) {
	            console.log('✅ Token encontrado no localStorage');
	        }
	    }
	    
	    // ====================================================
	    // 2. VALIDAÇÃO - SE NÃO TEM TOKEN, REDIRECIONA
	    // ====================================================
	    
	    if (!jwtToken) {
	        console.error('❌ Token JWT não encontrado em nenhuma fonte!');
	        console.error('Fontes verificadas: URL, sessionStorage, localStorage');
	        window.location.href = '/auth/login';
	        return;
	    }
	    
	    console.log('✅ Token JWT presente e válido');
	    
	    // ====================================================
	    // 3. CONFIGURA INTERCEPTOR GLOBAL PARA APIs
	    // ====================================================
	    
	    const originalFetch = window.fetch;
	    window.fetch = function(resource, options = {}) {
	        const newOptions = { ...options };
	        newOptions.headers = { ...newOptions.headers };
	        
	        const url = typeof resource === 'string' ? resource : resource.url;
	        const method = (newOptions.method || 'GET').toUpperCase();
	        
	        // Adiciona JWT token para TODAS as requisições
	        newOptions.headers['Authorization'] = `Bearer ${jwtToken}`;
	        
	        // Configura JSON para métodos que modificam dados
	        const modifyingMethods = ['POST', 'PUT', 'PATCH', 'DELETE'];
	        if (modifyingMethods.includes(method)) {
	            if (newOptions.body && typeof newOptions.body === 'object' && 
	                !(newOptions.body instanceof FormData)) {
	                newOptions.headers['Content-Type'] = 'application/json';
	                newOptions.body = JSON.stringify(newOptions.body);
	            }
	        }
	        
	        console.log(`📤 Fetch: ${method} ${url}`);
	        return originalFetch.call(this, resource, newOptions);
	    };
	    
	    console.log('✅ Interceptor configurado');
	    
	    // ====================================================
	    // 4. CONFIGURA EVENTOS DA INTERFACE
	    // ====================================================
	    
	    // Logout
	    document.getElementById('logoutBtn').addEventListener('click', function() {
	        console.log('🚪 Efetuando logout...');
	        
	        // Limpa TODOS os storages
	        localStorage.removeItem('token');
	        sessionStorage.clear();
	        
	        // Limpa cookies também se estiver usando
	        document.cookie.split(";").forEach(c => {
	            document.cookie = c.replace(/^ +/, "")
	                .replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
	        });
	        
	        window.location.href = '/auth/login';
	    });
	    
	    // Busca Avançada - VERSÃO SEGURA (sem token na URL)
	    document.getElementById('menuBusca').addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    
    console.log('🔍 Navegando para Busca Avançada...');
    
    // 1. Obtém o token do localStorage
    const jwtToken = localStorage.getItem('token');
    
    if (!jwtToken) {
        alert('❌ Token não encontrado! Faça login novamente.');
        window.location.href = '/auth/login';
        return;
    }
    
    console.log('✅ Token encontrado:', jwtToken.substring(0, 20) + '...');
    
    // 2. Salva também no sessionStorage (backup)
    sessionStorage.setItem('busca_token', jwtToken);
    
    // 3. **IMPORTANTE: Passa o token na URL para o JwtFilter encontrar**
    const tokenEncoded = encodeURIComponent(jwtToken);
    
    // 4. Navega para busca COM TOKEN NA URL
    window.location.href = `/admin/busca?token=${tokenEncoded}`;
    
    console.log('✅ Navegando para busca com token na URL...');
});

// ADICIONE também o botão de teste que você colocou:
document.getElementById('testeBuscaDireto').addEventListener('click', function() {
    console.log('🧪 TESTE: Acessar Busca Avançada...');
    
    const jwtToken = localStorage.getItem('token');
    
    if (!jwtToken) {
        alert('❌ Token não encontrado! Faça login primeiro.');
        return;
    }
    
    // Método 1: Via sessionStorage
    sessionStorage.setItem('busca_token', jwtToken);
    
    // Método 2: Via URL (fallback)
    const tokenEncoded = encodeURIComponent(jwtToken);
    window.location.href = `/admin/busca?token=${tokenEncoded}`;
    
    console.log('✅ Teste iniciado...');
});
	    
	    // ====================================================
	    // 5. VERIFICAÇÃO DE CONEXÃO COM API
	    // ====================================================
	    
	    // Testa se a API está acessível com o token
	    setTimeout(() => {
	        fetch('/api/usuarios')
	            .then(response => {
	                if (response.ok) {
	                    console.log('🌐 Conexão com API: ✅ OK');
	                } else {
	                    console.warn('⚠️ API retornou status:', response.status);
	                    if (response.status === 401 || response.status === 403) {
	                        console.error('❌ Token pode ter expirado!');
	                        localStorage.removeItem('token');
	                        window.location.href = '/auth/login';
	                    }
	                }
	            })
	            .catch(error => {
	                console.error('❌ Erro ao conectar com API:', error);
	            });
	    }, 500);
	    
	    console.log('=== DASHBOARD PRONTO ===');
	
            
            // Verifica se tem token e se API funciona
            setTimeout(() => {
                fetch('/api/usuarios')
                    .then(response => {
                        console.log('🔍 Verificação API:', response.status, response.ok ? '✅ OK' : '❌ FALHOU');
                        if (!response.ok) {
                            console.warn('⚠️ API não acessível com token atual');
                        }
                    })
                    .catch(error => {
                        console.error('❌ Erro na verificação API:', error);
                    });
            }, 1000);
        });
    </script>

	<!-- Seus scripts JavaScript -->
	<script src="/js/admin-dashboard.js"></script>
	<script src="/js/admin-mensagens.js"></script>
	<script src="/js/admin-usuarios.js"></script>
</body>
</html>
