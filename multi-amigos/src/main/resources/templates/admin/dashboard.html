<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - MultiAmigos</title>
    <link rel="stylesheet" href="/css/admin-dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="d-flex">
    <!-- Sidebar Menu -->
    <nav class="sidebar">
        <div class="sidebar-header p-3">
            <h5 class="text-white mb-0">
                <i class="bi bi-menu-button-wide"></i> Menu Admin
            </h5>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="#" id="menuUsuarios">
                    <i class="bi bi-people"></i> Usuários
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="menuMensagens">
                    <i class="bi bi-megaphone"></i> Mensagens
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="menuDashboard">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item mt-4">
                <hr class="border-light">
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/" id="menuHome">
                    <i class="bi bi-house"></i> Home
                </a>
            </li>
        </ul>
        <div class="sidebar-footer p-3 mt-auto">
            <small class="text-muted">
                <i class="bi bi-shield-check"></i> Admin Logado
            </small>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content flex-grow-1">
        <header class="bg-dark text-white p-3">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h4 mb-0" id="pageTitle">
                        <i class="bi bi-speedometer2"></i> Dashboard Admin
                    </h1>
                    <small class="text-muted" sec:authorize="isAuthenticated()">
                        Usuário: <span sec:authentication="name"></span>
                        <span sec:authentication="principal.authorities" class="badge bg-success ms-2"></span>
                    </small>
                </div>
                <div>
                    <button id="logoutBtn" class="btn btn-outline-light">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="container-fluid my-4" id="contentArea">
            <!-- Conteúdo será carregado dinamicamente aqui -->
            <div id="loadingArea" class="text-center my-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <p class="mt-2">Carregando conteúdo...</p>
            </div>
        </main>
    </div>

    <!-- Modal para detalhes do usuário -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalhes do Usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="userDetails">
                        <!-- Detalhes serão preenchidos via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para criar mensagem -->
    <div class="modal fade" id="mensagemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nova Mensagem</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formMensagem">
                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" class="form-control" id="tituloMensagem" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Conteúdo</label>
                            <textarea class="form-control" id="conteudoMensagem" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tipo</label>
                                <select class="form-select" id="tipoMensagem" required>
                                    <option value="INFORMATIVO">Informativo</option>
                                    <option value="IMPORTANTE">Importante</option>
                                    <option value="URGENTE">Urgente</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Validade (dias)</label>
                                <input type="number" class="form-control" id="diasValidade" 
                                       min="1" max="365" placeholder="Opcional">
                                <small class="text-muted">Deixe em branco para nunca expirar</small>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send"></i> Publicar Mensagem
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-dashboard.js"></script>
</body>
</html>
