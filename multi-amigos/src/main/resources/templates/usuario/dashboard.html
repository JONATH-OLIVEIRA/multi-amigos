<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Rede - MultiAmigos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; }
        .main-card { border-radius: 15px; border: none; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .stats-card { transition: transform 0.3s; }
        .stats-card:hover { transform: translateY(-5px); }
        .user-img { width: 80px; height: 80px; }
        .mensagem-card { transition: all 0.3s; }
        .mensagem-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        /* Estilo para mensagens flutuantes */
        .mensagem-flutuante {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-people-fill"></i> <strong>Minha Rede</strong>
            </a>
            <div class="navbar-nav ms-auto">
                <span class="nav-link text-light">
                    <i class="bi bi-person-circle"></i> 
                    <span th:text="${username}">Usuário</span>
                </span>
                <button class="btn btn-outline-light ms-3" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Seção de Mensagens do Sistema -->
        <div class="card main-card mb-4">
            <div class="card-header bg-primary text-white">
                <div class="d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-megaphone"></i> Mensagens do Sistema</h4>
                    <button class="btn btn-light btn-sm" onclick="window.usuarioMensagemManager?.carregarMensagensSistema()">
                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div id="mensagensContainer">
                    <!-- Mensagens serão carregadas aqui pelo JavaScript -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-3 text-muted">Carregando mensagens...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cards de Funcionalidades -->
        <div class="row mt-4">
            <div class="col-md-4 mb-3">
                <div class="card stats-card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-diagram-3 display-4 text-primary"></i>
                        <h5 class="card-title mt-3">Minha Rede</h5>
                        <p class="card-text">Veja sua rede de contatos, filhos e netos.</p>
                        <button class="btn btn-primary" onclick="carregarMinhaRede()">
                            Ver Rede
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 mb-3">
                <div class="card stats-card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-link-45deg display-4 text-success"></i>
                        <h5 class="card-title mt-3">Gerar Convite</h5>
                        <p class="card-text">Convide novas pessoas para sua rede.</p>
                        <button class="btn btn-success" onclick="gerarLinkConvite()">
                            Gerar Link
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 mb-3">
                <div class="card stats-card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-person-circle display-4 text-info"></i>
                        <h5 class="card-title mt-3">Meu Perfil</h5>
                        <p class="card-text">Atualize seus dados pessoais.</p>
                        <button class="btn btn-info" onclick="verMeuPerfil()">
                            Ver Perfil
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Área de Conteúdo Dinâmico -->
        <div id="conteudoDinamico" class="mt-4">
            <!-- Conteúdo será carregado aqui dinamicamente -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Nossos scripts organizados -->
    <!-- PRIMEIRO: Interceptor (se tiver um arquivo separado) -->
    <!-- <script src="/js/usuario-interceptor.js"></script> -->
    
    <!-- DEPOIS: Nossos managers -->
    <script src="/js/usuario-mensagem.js"></script>
    <script src="/js/usuario-perfil.js"></script>
    
    <script>
        // Funções básicas do dashboard
        function logout() {
            if (confirm("Deseja realmente sair?")) {
                localStorage.removeItem('token');
                window.location.href = "/auth/login";
            }
        }
        
        function carregarMinhaRede() {
            const conteudo = document.getElementById('conteudoDinamico');
            
            conteudo.innerHTML = `
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="bi bi-diagram-3"></i> Minha Rede</h5>
                            <button class="btn btn-light btn-sm" onclick="carregarMinhaRede()">
                                <i class="bi bi-arrow-clockwise"></i> Atualizar
                            </button>
                        </div>
                    </div>
                    <div class="card-body" id="redeContainer">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary"></div>
                            <p class="mt-3 text-muted">Carregando sua rede...</p>
                        </div>
                    </div>
                </div>
            `;
            
            // Carrega a hierarquia
            setTimeout(() => {
                carregarHierarquia();
            }, 100);
        }
        
        function carregarHierarquia() {
            const token = localStorage.getItem('token');
            if (!token) {
                mostrarMensagem('Faça login para ver sua rede', 'danger');
                return;
            }
            
            fetch('/api/me/hierarquia', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (!response.ok) throw new Error(`Erro ${response.status}`);
                return response.json();
            })
            .then(hierarquia => {
                const container = document.getElementById('redeContainer');
                
                if (!hierarquia || hierarquia.length === 0) {
                    container.innerHTML = `
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            Você ainda não tem ninguém na sua rede.
                        </div>
                    `;
                    return;
                }
                
                let html = `
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Email</th>
                                    <th>Telefone</th>
                                    <th>Status</th>
                                    <th>Data Cadastro</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                hierarquia.forEach(filho => {
                    const status = filho.ativo ? 
                        '<span class="badge bg-success">Ativo</span>' : 
                        '<span class="badge bg-secondary">Inativo</span>';
                    
                    html += `
                        <tr>
                            <td>${escapeHtml(filho.nome)}</td>
                            <td>${escapeHtml(filho.email)}</td>
                            <td>${escapeHtml(filho.telefone || 'Não informado')}</td>
                            <td>${status}</td>
                            <td>${formatarData(filho.dataCriacao)}</td>
                        </tr>
                    `;
                });
                
                html += `
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-3">
                        <div class="alert alert-success">
                            <i class="bi bi-people"></i>
                            <strong>Total na sua rede:</strong> ${hierarquia.length} pessoa${hierarquia.length !== 1 ? 's' : ''}
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
            })
            .catch(error => {
                console.error('Erro ao carregar hierarquia:', error);
                const container = document.getElementById('redeContainer');
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i>
                        Não foi possível carregar sua rede. Tente novamente.
                    </div>
                `;
            });
        }
        
        function gerarLinkConvite() {
            const conteudo = document.getElementById('conteudoDinamico');
            
            conteudo.innerHTML = `
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="bi bi-link-45deg"></i> Gerar Convite</h5>
                            <button class="btn btn-light btn-sm" onclick="gerarLinkConvite()">
                                <i class="bi bi-arrow-clockwise"></i> Atualizar
                            </button>
                        </div>
                    </div>
                    <div class="card-body" id="conviteContainer">
                        <div class="text-center py-5">
                            <div class="spinner-border text-success"></div>
                            <p class="mt-3 text-muted">Gerando seu link de convite...</p>
                        </div>
                    </div>
                </div>
            `;
            
            // Gera o link de convite
            setTimeout(() => {
                gerarLink();
            }, 100);
        }
        
        function gerarLink() {
            const token = localStorage.getItem('token');
            if (!token) {
                mostrarMensagem('Faça login para gerar convite', 'danger');
                return;
            }
            
            fetch('/api/me/link-convite', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (!response.ok) throw new Error(`Erro ${response.status}`);
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('conviteContainer');
                
                container.innerHTML = `
                    <div class="text-center">
                        <div class="alert alert-success">
                            <h5><i class="bi bi-check-circle"></i> ${data.mensagem}</h5>
                            <p class="mb-3">${data.instrucoes}</p>
                        </div>
                        
                        <div class="card mt-3">
                            <div class="card-header bg-light">
                                <h6 class="mb-0">Seu link de convite:</h6>
                            </div>
                            <div class="card-body">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="linkConvite" value="${data.link}" readonly>
                                    <button class="btn btn-success" type="button" onclick="copiarLink()">
                                        <i class="bi bi-clipboard"></i> Copiar
                                    </button>
                                </div>
                                <div class="mt-3">
                                    <button class="btn btn-outline-primary btn-sm" onclick="compartilharWhatsApp('${data.link}')">
                                        <i class="bi bi-whatsapp"></i> Compartilhar no WhatsApp
                                    </button>
                                    <button class="btn btn-outline-primary btn-sm ms-2" onclick="compartilharEmail('${data.link}')">
                                        <i class="bi bi-envelope"></i> Compartilhar por Email
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <div class="alert alert-info">
                                <h6><i class="bi bi-info-circle"></i> Como funciona:</h6>
                                <ul class="mb-0">
                                    <li>Cada pessoa que se cadastrar por este link será seu "filho" na rede</li>
                                    <li>Você poderá ver todos que cadastrou na seção "Minha Rede"</li>
                                    <li>Seus filhos também podem convidar outras pessoas</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
            })
            .catch(error => {
                console.error('Erro ao gerar link:', error);
                const container = document.getElementById('conviteContainer');
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i>
                        Não foi possível gerar o link de convite. Tente novamente.
                    </div>
                `;
            });
        }
        
        function verMeuPerfil() {
            const conteudo = document.getElementById('conteudoDinamico');
            
            conteudo.innerHTML = `
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="bi bi-person-circle"></i> Meu Perfil</h5>
                            <button class="btn btn-light btn-sm" onclick="window.usuarioPerfilManager?.carregarMeuPerfil()">
                                <i class="bi bi-arrow-clockwise"></i> Atualizar
                            </button>
                        </div>
                    </div>
                    <div class="card-body" id="perfilContainer">
                        <!-- Perfil será carregado aqui pelo UsuarioPerfilManager -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-info"></div>
                            <p class="mt-3 text-muted">Carregando perfil...</p>
                        </div>
                    </div>
                </div>
            `;
            
            // Inicializa o manager após um pequeno delay
            setTimeout(() => {
                if (window.UsuarioPerfilManager && !window.usuarioPerfilManager) {
                    window.usuarioPerfilManager = new UsuarioPerfilManager();
                } else if (window.usuarioPerfilManager) {
                    window.usuarioPerfilManager.carregarMeuPerfil();
                }
            }, 100);
        }
        
        // Funções auxiliares
        function copiarLink() {
            const input = document.getElementById('linkConvite');
            if (!input) return;
            
            input.select();
            document.execCommand('copy');
            
            // Feedback visual
            const btn = document.querySelector('[onclick="copiarLink()"]');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-check"></i> Copiado!';
            btn.classList.add('btn-success');
            btn.classList.remove('btn-outline-success');
            
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('btn-success');
                btn.classList.add('btn-outline-success');
            }, 2000);
            
            mostrarMensagem('Link copiado para a área de transferência!', 'success');
        }
        
        function compartilharWhatsApp(link) {
            const texto = `Olá! Venha se cadastrar na minha rede: ${link}`;
            const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }
        
        function compartilharEmail(link) {
            const assunto = 'Convite para minha rede - MultiAmigos';
            const corpo = `Olá!\n\nVenha se cadastrar na minha rede através deste link:\n${link}\n\nAtenciosamente.`;
            const url = `mailto:?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
            window.location.href = url;
        }
        
        function mostrarMensagem(texto, tipo = 'info') {
            // Remove mensagens anteriores
            document.querySelectorAll('.mensagem-flutuante').forEach(el => el.remove());
            
            const icone = tipo === 'success' ? 'bi-check-circle' : 
                         tipo === 'danger' ? 'bi-exclamation-triangle' : 
                         tipo === 'warning' ? 'bi-exclamation-triangle' : 'bi-info-circle';
            
            const mensagemHtml = `
                <div class="mensagem-flutuante alert alert-${tipo} alert-dismissible fade show" role="alert">
                    <i class="bi ${icone} me-2"></i>
                    ${texto}
                    <button type="button" class="btn-close" onclick="this.parentElement.remove()"></button>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', mensagemHtml);
            
            // Remove automaticamente após 5 segundos
            setTimeout(() => {
                document.querySelector('.mensagem-flutuante')?.remove();
            }, 5000);
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatarData(dataString) {
            if (!dataString) return 'Data não informada';
            
            try {
                const data = new Date(dataString);
                return data.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (e) {
                return dataString;
            }
        }
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Dashboard do usuário carregado');
            
            // Configura interceptor para todas as requisições
            const originalFetch = window.fetch;
            window.fetch = function(resource, options = {}) {
                const token = localStorage.getItem('token');
                if (!token) {
                    console.error('❌ Token não encontrado');
                    return Promise.reject(new Error('Token não encontrado'));
                }
                
                const url = typeof resource === 'string' ? resource : resource.url;
                
                // Não intercepta arquivos estáticos
                if (url.includes('.css') || url.includes('.js') || url.includes('.ico')) {
                    return originalFetch.call(this, resource, options);
                }
                
                const newOptions = { ...options };
                newOptions.headers = {
                    ...newOptions.headers,
                    'Authorization': `Bearer ${token}`
                };
                
                console.log(`📤 Interceptor: ${url}`);
                return originalFetch.call(this, resource, newOptions);
            };
            
            console.log('✅ Interceptor configurado');
            
            // Inicializa o mensagem manager se existir
            setTimeout(() => {
                if (window.UsuarioMensagemManager && !window.usuarioMensagemManager) {
                    console.log('🚀 Inicializando UsuarioMensagemManager...');
                    window.usuarioMensagemManager = new UsuarioMensagemManager();
                }
            }, 300);
        });
    </script>
</body>
</html>
