<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Rede - MultiAmigos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; }
        .main-card { border-radius: 15px; border: none; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .stats-card { transition: transform 0.3s; }
        .stats-card:hover { transform: translateY(-5px); }
        .user-img { width: 80px; height: 80px; }
        .mensagem-card { transition: all 0.3s; }
        .mensagem-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .mensagem-flutuante {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-people-fill"></i> <strong>Minha Rede</strong>
            </a>
            <div class="navbar-nav ms-auto">
                <span class="nav-link text-light">
                    <i class="bi bi-person-circle"></i>
                   <span id="navbarUsername"></span>
                </span>
                <button class="btn btn-outline-light ms-3" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Seção de Mensagens do Sistema -->
        <div class="card main-card mb-4">
            <div class="card-header bg-primary text-white">
                <div class="d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-megaphone"></i> Mensagens do Sistema</h4>
                    <button class="btn btn-light btn-sm" id="btnAtualizarMensagens">
                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div id="mensagensContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-3 text-muted">Carregando mensagens...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cards de Funcionalidades -->
        <div class="row mt-4">
            <div class="col-md-4 mb-3">
                <div class="card stats-card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-diagram-3 display-4 text-primary"></i>
                        <h5 class="card-title mt-3">Minha Rede</h5>
                        <p class="card-text">Veja sua rede de contatos, filhos e netos.</p>
                        <button class="btn btn-primary" id="btnVerRede">Ver Rede</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card stats-card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-link-45deg display-4 text-success"></i>
                        <h5 class="card-title mt-3">Gerar Convite</h5>
                        <p class="card-text">Convide novas pessoas para sua rede.</p>
                        <button class="btn btn-success" id="btnGerarLink">Gerar Link</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card stats-card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-person-circle display-4 text-info"></i>
                        <h5 class="card-title mt-3">Meu Perfil</h5>
                        <p class="card-text">Atualize seus dados pessoais.</p>
                        <button class="btn btn-info" id="btnVerPerfil">Ver Perfil</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Área de Conteúdo Dinâmico -->
        <div id="conteudoDinamico" class="mt-4"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Seus scripts -->
    <script src="/js/usuario-mensagem.js"></script>
    <script src="/js/usuario-perfil.js"></script>
    <script src="/js/dashboard-usuario.js"></script>
</body>
</html>
