<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MultiAmigos</title>

    <link rel="stylesheet" href="/css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Login</h3>

        <!-- ✅ espaço para mensagens -->
        <div id="loginMsg"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email ou Telefone</label>
                <!-- 🔥 agora aceita email OU telefone -->
                <input
                    type="text"
                    class="form-control"
                    id="email"
                    name="login"
                    placeholder="email@exemplo.com ou (11) 99999-9999"
                    autocomplete="username"
                    required
                >
                <div class="form-text">
                    Você pode entrar usando seu email ou seu telefone cadastrado.
                </div>
            </div>

            <div class="mb-2">
                <label for="senha" class="form-label">Senha</label>
                <input
                    type="password"
                    class="form-control"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <!-- ✅ Esqueci minha senha -->
            <div class="d-flex justify-content-end mb-3">
                <a href="/auth/forgot" class="small text-decoration-none">Esqueci minha senha</a>
            </div>

            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <p class="text-center mt-3 mb-0">
            Não tem conta? <a href="/auth/register">Cadastre-se</a>
        </p>
    </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
