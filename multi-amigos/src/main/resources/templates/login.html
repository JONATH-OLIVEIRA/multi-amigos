<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MultiAmigos</title>

    <link rel="stylesheet" href="/css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery Mask Plugin -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Login</h3>

        <!-- ✅ espaço para mensagens -->
        <div id="loginMsg"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="login" class="form-label">Email ou Telefone</label>
                <!-- 🔥 agora aceita email OU telefone com máscara -->
                <input
                    type="text"
                    class="form-control"
                    id="login"
                    name="login"
                    placeholder="email@exemplo.com ou (11) 99999-9999"
                    autocomplete="username"
                    required
                >
                <div class="form-text">
                    Você pode entrar usando seu email ou seu telefone cadastrado.
                </div>
            </div>

            <div class="mb-2">
                <label for="senha" class="form-label">Senha</label>
                <input
                    type="password"
                    class="form-control"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <!-- ✅ Esqueci minha senha -->
            <div class="d-flex justify-content-end mb-3">
                <a href="/auth/forgot" class="small text-decoration-none">Esqueci minha senha</a>
            </div>

            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <p class="text-center mt-3 mb-0">
            Não tem conta? <a href="/auth/register">Cadastre-se</a>
        </p>
    </div>
</div>

<script src="/js/login.js"></script>
<script>
    // Aplica máscara de telefone no campo de login
    $(document).ready(function() {
        // Máscara para telefone: (11) 99999-9999 ou (11) 9999-9999
        $('#login').mask('(00) 00000-0000', {
            placeholder: '(00) 00000-0000',
            onKeyPress: function(telefone, event, currentField, options) {
                // Ajusta a máscara baseado na quantidade de dígitos
                const digits = telefone.replace(/\D/g, '').length;
                if (digits <= 10) {
                    // Telefone com 8 dígitos + 2 do DDD = 10 dígitos total
                    $(this).mask('(00) 0000-00009', options);
                } else {
                    // Celular com 9 dígitos + 2 do DDD = 11 dígitos total
                    $(this).mask('(00) 00000-0000', options);
                }
            }
        });

        // Permite que o campo aceite email também
        // Quando o usuário digitar @, remove a máscara
        $('#login').on('input', function() {
            const valor = $(this).val();
            if (valor.includes('@')) {
                // Se tiver @, é email - remove a máscara
                $(this).unmask();
            } else {
                // Se não tiver @, aplica máscara novamente se necessário
                const apenasNumeros = valor.replace(/\D/g, '');
                if (apenasNumeros.length > 0 && !$(this).data('maskApplied')) {
                    $(this).mask('(00) 00000-0000', {
                        placeholder: '(00) 00000-0000',
                        onKeyPress: function(telefone, event, currentField, options) {
                            const digits = telefone.replace(/\D/g, '').length;
                            if (digits <= 10) {
                                $(this).mask('(00) 0000-00009', options);
                            } else {
                                $(this).mask('(00) 00000-0000', options);
                            }
                        }
                    });
                    $(this).data('maskApplied', true);
                } else if (apenasNumeros.length === 0 && $(this).data('maskApplied')) {
                    $(this).unmask();
                    $(this).removeData('maskApplied');
                }
            }
        });
    });
</script>
</body>
</html>
