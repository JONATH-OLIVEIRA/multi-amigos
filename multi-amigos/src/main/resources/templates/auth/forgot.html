<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esqueci minha senha - MultiAmigos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="mb-3">Esqueci minha senha</h4>
          <p class="text-muted">Digite seu e-mail. Se existir, vamos enviar um link para redefinir.</p>

          <form id="forgotForm">
            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input id="email" type="email" class="form-control" required />
            </div>

            <button id="btnSubmit" type="submit" class="btn btn-primary w-100">
              Enviar link
            </button>

            <div id="msg" class="mt-3"></div>

            <div class="mt-3 text-center">
              <a href="/auth/login">Voltar ao login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btnSubmit');
  const msg = document.getElementById('msg');

  msg.innerHTML = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Enviando...';

  try {
    const res = await fetch('/auth/forgot', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email })
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data?.message || 'Não foi possível enviar o link agora.');
    }

    msg.innerHTML = `
      <div class="alert alert-success">
        ${data.message || 'Se o e-mail existir, enviaremos um link de redefinição.'}
      </div>
    `;
  } catch (err) {
    msg.innerHTML = `
      <div class="alert alert-danger">
        ${err.message}
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar link';
  }
});
</script>
</body>
</html>
