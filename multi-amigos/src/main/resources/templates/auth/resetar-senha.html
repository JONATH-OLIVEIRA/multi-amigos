<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redefinir senha - MultiAmigos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="mb-3">Redefinir senha</h4>
          <p class="text-muted">Crie uma nova senha para sua conta.</p>

          <form id="resetForm">
            <input type="hidden" id="token" th:value="${token}" />

            <div class="mb-3">
              <label class="form-label">Nova senha</label>
              <input id="novaSenha" type="password" class="form-control" minlength="6" required />
              <div class="form-text">Mínimo 6 caracteres.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Confirmar nova senha</label>
              <input id="confirmarSenha" type="password" class="form-control" minlength="6" required />
            </div>

            <button id="btnSubmit" type="submit" class="btn btn-success w-100">
              Redefinir senha
            </button>

            <div id="msg" class="mt-3"></div>

            <div class="mt-3 text-center">
              <a href="/auth/login">Voltar ao login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const token = document.getElementById('token').value.trim();
  const novaSenha = document.getElementById('novaSenha').value;
  const confirmarSenha = document.getElementById('confirmarSenha').value;

  const btn = document.getElementById('btnSubmit');
  const msg = document.getElementById('msg');
  msg.innerHTML = '';

  if (!token) {
    msg.innerHTML = `<div class="alert alert-danger">Token inválido. Solicite novamente.</div>`;
    return;
  }

  if (novaSenha.length < 6) {
    msg.innerHTML = `<div class="alert alert-danger">A senha precisa ter pelo menos 6 caracteres.</div>`;
    return;
  }

  if (novaSenha !== confirmarSenha) {
    msg.innerHTML = `<div class="alert alert-danger">As senhas não coincidem.</div>`;
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Salvando...';

  try {
    const res = await fetch('/auth/reset', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token, novaSenha })
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data?.message || 'Não foi possível redefinir a senha.');
    }

    msg.innerHTML = `
      <div class="alert alert-success">
        ${data.message || 'Senha redefinida com sucesso.'}
        <div class="mt-2">Você será redirecionado para o login.</div>
      </div>
    `;

    setTimeout(() => window.location.href = '/auth/login?reset=success', 1200);

  } catch (err) {
    msg.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Redefinir senha';
  }
});
</script>
</body>
</html>
